<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Taty Joias</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="admin.css" />

    <style>
      .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: url("images/back_dourado.jpeg") no-repeat center
          center/cover;
      }

      .login-form {
        background: rgba(255, 255, 255, 0.9);
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }

      .login-form h2 {
        margin-bottom: 1.5rem;
        text-align: center;
        color: #d4af37; /* Dourado */
        font-family: "Playfair Display", serif;
      }

      .login-form .form-group {
        margin-bottom: 1rem;
      }

      .login-form .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #333;
        font-family: "Montserrat", sans-serif;
      }

      .login-form .form-group input {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: "Montserrat", sans-serif;
      }

      .login-form .form-actions {
        display: flex;
        justify-content: center;
      }

      .login-form .form-actions button {
        padding: 0.5rem 1rem;
        background-color: #d4af37; /* Dourado */
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-family: "Montserrat", sans-serif;
      }

      .login-form .form-actions button:hover {
        background-color: #b38e2c; /* Tom mais escuro de dourado */
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container" id="loginContainer">
      <form class="login-form" id="loginForm">
        <h2>Login Admin</h2>
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" required />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" required />
        </div>
        <div class="form-actions">
          <button type="submit">Entrar</button>
        </div>
      </form>
    </div>

    <div id="adminContent" class="hidden">
      <!-- ...existing admin content... -->
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");
      const loginContainer = document.getElementById("loginContainer");
      const adminContent = document.getElementById("adminContent");

      const validCredentials = {
        username: "admin",
        password: "1234", // Substitua por credenciais seguras
      };

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if (
          username === validCredentials.username &&
          password === validCredentials.password
        ) {
          loginContainer.classList.add("hidden");
          adminContent.classList.remove("hidden");
        } else {
          alert("Credenciais inválidas. Tente novamente.");
        }
      });
    </script>
  </body>
</html>
