<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Taty Joias</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="admin.css" />

    <style>
      .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: url("images/back_dourado.jpeg") no-repeat center
          center/cover;
      }

      .login-form {
        background: rgba(255, 255, 255, 0.9);
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }

      .login-form h2 {
        margin-bottom: 1.5rem;
        text-align: center;
        color: #d4af37; /* Dourado */
        font-family: "Playfair Display", serif;
      }

      .login-form .form-group {
        margin-bottom: 1rem;
      }

      .login-form .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #333;
        font-family: "Montserrat", sans-serif;
      }

      .login-form .form-group input {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: "Montserrat", sans-serif;
      }

      .login-form .form-actions {
        display: flex;
        justify-content: center;
      }

      .login-form .form-actions button {
        padding: 0.5rem 1rem;
        background-color: #d4af37; /* Dourado */
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-family: "Montserrat", sans-serif;
      }

      .login-form .form-actions button:hover {
        background-color: #b38e2c; /* Tom mais escuro de dourado */
      }

      .login-error {
        color: #d32f2f;
        font-size: 0.875rem;
        margin-top: 0.5rem;
        text-align: center;
        display: none;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container" id="loginContainer">
      <form class="login-form" id="loginForm">
        <h2>Login Admin</h2>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input
            type="email"
            id="loginEmail"
            required
            placeholder="admin@exemplo.com"
          />
        </div>
        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input
            type="password"
            id="loginPassword"
            required
            placeholder="Digite sua senha"
          />
        </div>
        <div id="loginError" class="login-error"></div>
        <div class="form-actions">
          <button type="submit">Entrar</button>
        </div>
      </form>
    </div>

    <div id="adminContent" class="hidden">
      <!-- Conteúdo do painel admin será carregado aqui -->
      <div class="admin-header">
        <h1>Painel Administrativo</h1>
        <button id="logoutBtn" class="btn-logout">Sair</button>
      </div>

      <div class="admin-sections">
        <nav class="admin-nav">
          <a href="#" class="nav-item active" data-section="products">
            <i class="fas fa-gem"></i> Produtos
          </a>
          <a href="#" class="nav-item" data-section="orders">
            <i class="fas fa-shopping-cart"></i> Pedidos
          </a>
          <a href="#" class="nav-item" data-section="analytics">
            <i class="fas fa-chart-bar"></i> Relatórios
          </a>
        </nav>

        <main class="admin-main">
          <!-- Seção de Produtos -->
          <section id="products-section" class="admin-section active">
            <div class="section-header">
              <h2>Gerenciar Produtos</h2>
              <button id="addProductBtn" class="btn-primary">
                <i class="fas fa-plus"></i> Adicionar Produto
              </button>
            </div>

            <div class="loading" id="adminLoading">
              <div class="spinner"></div>
              <p>Carregando produtos...</p>
            </div>

            <div class="products-table-container" id="productsTableContainer">
              <table class="products-table">
                <thead>
                  <tr>
                    <th>Imagem</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Status</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="productsTableBody">
                  <!-- Produtos serão inseridos aqui -->
                </tbody>
              </table>
            </div>
          </section>

          <!-- Outras seções podem ser adicionadas aqui -->
        </main>
      </div>
    </div>

    <!-- Modal para adicionar/editar produto -->
    <div id="productModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Adicionar Produto</h3>
          <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <form id="productForm">
          <div class="form-group">
            <label for="productName">Nome do Produto</label>
            <input type="text" id="productName" required />
          </div>
          <div class="form-group">
            <label for="productDescription">Descrição</label>
            <textarea id="productDescription" required></textarea>
          </div>
          <div class="form-group">
            <label for="productPrice">Preço (R$)</label>
            <input type="number" id="productPrice" step="0.01" required />
          </div>

          <div class="form-group">
            <label>Imagem do Produto</label>
            <div class="image-input-tabs">
              <button
                type="button"
                class="tab-btn active"
                data-tab="upload"
                id="uploadTab"
              >
                <i class="fas fa-upload"></i> Upload da Galeria
              </button>
              <button type="button" class="tab-btn" data-tab="url" id="urlTab">
                <i class="fas fa-link"></i> URL da Imagem
              </button>
            </div>

            <div class="tab-content active" id="uploadContent">
              <div class="file-upload-wrapper">
                <input
                  type="file"
                  id="productImageFile"
                  accept="image/*"
                  style="display: none"
                />
                <button type="button" class="btn-upload" id="selectImageBtn">
                  <i class="fas fa-image"></i> Escolher Imagem
                </button>
                <span id="fileName" class="file-name"
                  >Nenhum arquivo selecionado</span
                >
              </div>
            </div>

            <div class="tab-content" id="urlContent">
              <input
                type="url"
                id="productImage"
                placeholder="https://exemplo.com/imagem.jpg"
              />
            </div>

            <div id="imagePreview" class="image-preview" style="display: none">
              <img id="previewImg" alt="Preview" />
            </div>
          </div>

          <div class="form-group">
            <label for="productStatus">Status</label>
            <select id="productStatus" required>
              <option value="disponivel">Disponível</option>
              <option value="esgotado">Esgotado</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="button" id="cancelBtn" class="btn-secondary">
              Cancelar
            </button>
            <button type="submit" class="btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <!-- Scripts -->
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
